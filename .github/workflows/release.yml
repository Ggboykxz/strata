# Release gate waits for GATE:P0 and a Director merge.
name: release
on:
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  placeholder:
    name: no release job yet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "RELEASE - Director merges PR #1 first"
