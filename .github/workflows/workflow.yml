# Master §18: reject out-of-domain edits, missing locks, handoffs without acceptance, PRs without a distinct reviewer, unresolved VETO, >3 arbitration rounds, stub acc scripts.
name: workflow
on: { push: { branches: [main] }, pull_request: }
permissions: { contents: read }
concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: workflow OS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-workflows.mjs
      - run: node scripts/validate-ownership.mjs
      - run: node scripts/validate-locks.mjs
