# DECLARED STUB until the owning task implements validate-gdd.mjs.
# Manual trigger only: a stub must never be silently green on a PR.
name: gdd - module coverage
on: { workflow_dispatch: }
permissions: { contents: read }
concurrency:
  group: gdd-module-coverage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: GDD modules and 19 fields
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/validate-gdd.mjs
