# The dependency-graph API returns 403 for this repository (observed 2026-11-18, run 44218555810).
# Until the graph is enabled in repo settings, this workflow is manual-only: a red gate on an
# unavailable service would hide real failures. Local pin/licence enforcement lives in validate-workflows
# and validate-manifest, both blocking in ci.yml.
name: dependency - license review
on: { workflow_dispatch: }
permissions: { contents: read, pull-requests: read }
concurrency:
  group: dependency-license-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
